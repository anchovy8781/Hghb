<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>부산 2033</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ══ 메인 메뉴 ══════════════════════════════════ -->
<div id="menu" class="screen">
  <div class="menu-sky">
    <svg class="skyline" viewBox="0 0 400 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <defs>
        <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#0000" />
          <stop offset="100%" stop-color="#000000" stop-opacity="0.85" />
        </linearGradient>
      </defs>
      <g fill="#1b1b1b">
        <rect x="8" y="120" width="26" height="100"/>
        <rect x="40" y="96" width="18" height="124"/>
        <rect x="64" y="140" width="30" height="80"/>
        <rect x="100" y="72" width="22" height="148"/>
        <rect x="128" y="132" width="34" height="88"/>
        <rect x="168" y="108" width="20" height="112"/>
        <rect x="196" y="150" width="40" height="70"/>
        <rect x="242" y="88" width="24" height="132"/>
        <rect x="272" y="128" width="30" height="92"/>
        <rect x="308" y="60" width="16" height="160"/>
        <rect x="330" y="144" width="28" height="76"/>
        <rect x="364" y="112" width="28" height="108"/>
      </g>
      <g fill="#2a2a2a">
        <polygon points="0,180 60,150 120,178 180,158 260,186 340,164 400,184 400,220 0,220"/>
      </g>
      <path d="M300 60 L316 20 L332 60 Z" fill="#242424"/>
      <rect width="400" height="220" fill="url(#fog)"/>
    </svg>
  </div>

  <div class="menu-inner">
    <div class="menu-top">
      <div class="menu-title">부산 <span>2033</span></div>
      <div class="menu-sub">핵이 터진 도시에서, 당신의 이야기</div>
    </div>

    <div class="radio" id="radio">
      <div class="radio-body">
        <div class="radio-dots"><i></i><i></i><i></i></div>
        <div class="radio-screen">
          <div class="radio-label">부산 생존 방송 · 89.1</div>
          <div class="radio-text" id="radioText">…</div>
        </div>
        <button class="radio-btn" id="radioNext" aria-label="다음 소식">▾</button>
      </div>
    </div>

    <div class="menu-actions">
      <button class="big-btn resume hidden" id="btnResume">
        <span class="b-title">이어하기</span>
        <span class="b-sub" id="resumeInfo"></span>
      </button>
      <button class="big-btn start" id="btnStart">
        <span class="b-title">게임 시작</span>
        <span class="b-sub">새로운 여정을 떠납니다</span>
      </button>
    </div>

    <div class="menu-nav">
      <button data-menu="records"><i>🏆</i><span>기록실</span></button>
      <button data-menu="endings"><i>📖</i><span>엔딩</span></button>
      <button data-menu="help"><i>❔</i><span>도움말</span></button>
      <button data-menu="credit"><i>✎</i><span>만든 것</span></button>
    </div>
  </div>
</div>

<!-- ══ 진행 화면 ══════════════════════════════════ -->
<div id="app" class="screen hidden">

  <header id="hud">
    <button id="menuBtn" class="hud-progress" aria-label="진행도">
      <span class="p-label">진행도 <b id="progNum">0%</b></span>
      <span class="p-bar"><i id="progFill"></i></span>
      <span class="p-tag" id="progTag">서사시</span>
    </button>

    <div class="hud-stats"></div>

    <div class="hud-badges">
      <button class="badge shield" id="badgeRank" title="가젯"><span>★</span></button>
    </div>
  </header>

  <main id="story" tabindex="0">
    <div id="pages"></div>
    <section id="choices" aria-live="polite"></section>
    <div id="pageno">- 0 -</div>
  </main>

  <div class="side-tools">
    <button class="tool" id="btnSave"><span class="ico-t">💾</span>저장</button>
    <button class="tool gadget" id="btnGadget"><span class="ico-t">🎒</span>소지품<i class="count" id="gadgetCount">0</i></button>
  </div>

  <footer id="belt"></footer>
</div>

<!-- ══ 가젯 시트 ══════════════════════════════════ -->
<div id="gadgetSheet" class="gsheet hidden">
  <div class="gsheet-inner">
    <div class="gsheet-tabs">
      <button data-gtab="all" class="on">전체</button>
      <button data-gtab="skill">능력</button>
      <button data-gtab="item">아이템</button>
      <button data-gtab="state">상태</button>
      <button data-gtab="craft">만들기</button>
      <button data-gtab="log">기록</button>
    </div>
    <div class="gsheet-body" id="gsheetBody"></div>
    <div class="gsheet-foot">
      <button id="gRestart"><i>↻</i><span>재시작</span></button>
      <button id="gClose" class="x"><i>✕</i></button>
      <button id="gSort"><i>↓</i><span>최신순</span></button>
    </div>
  </div>
</div>

<!-- ══ 안내 시트 ══════════════════════════════════ -->
<div id="infoSheet" class="gsheet hidden">
  <div class="gsheet-inner light">
    <div class="gsheet-head"><b id="infoTitle">기록실</b><button id="infoClose">닫기</button></div>
    <div class="gsheet-body" id="infoBody"></div>
  </div>
</div>

<div id="ask" class="ask hidden">
  <div class="ask-box">
    <p id="askText"></p>
    <div class="ask-btns">
      <button id="askNo">아니오</button>
      <button id="askYes" class="yes">예</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

</body>
</html>
